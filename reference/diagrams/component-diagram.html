<div class="info" id="infoPanel"><p class="info-empty">Click a component to see details</p></div>
<script>
const C={"app": {"name": "Application", "desc": "The program that builds and drives the pipeline. Owns the main thread and the GLib event loop.", "role": "External boundary"}, "pipeline": {"name": "GstPipeline", "desc": "Top-level container that binds elements into a runnable graph with shared clock and bus.", "role": "Core abstraction"}, "element": {"name": "GstElement", "desc": "The unit of processing. Sources, filters, encoders, decoders, and sinks are all elements.", "role": "Core abstraction"}, "pad": {"name": "GstPad", "desc": "A typed connection point on an element through which buffers and events flow.", "role": "Core abstraction"}, "buffer": {"name": "GstBuffer", "desc": "A reference-counted unit of media data with timestamps and flags.", "role": "Core abstraction"}, "caps": {"name": "GstCaps", "desc": "Structured description of a data format, negotiated between pads at link time.", "role": "Core abstraction"}, "bus": {"name": "GstBus", "desc": "Out-of-band message channel. Elements post error, state-changed, EOS, tag messages here.", "role": "Framework"}, "clock": {"name": "GstClock", "desc": "Provides a monotonic time reference to every sink; used for scheduling buffer rendering.", "role": "Framework"}, "registry": {"name": "Plugin Registry", "desc": "Cached catalog of available element factories, type finders, and device providers.", "role": "Plugin layer"}, "plugin": {"name": "Plugin .so", "desc": "Shared library providing one or more element factories. Loaded lazily by the registry.", "role": "Plugin layer"}};
const inIframe=window.self!==window.top;
if(inIframe)document.getElementById('infoPanel').classList.add('hidden');
let sel=null;
function select(id){
  document.querySelectorAll('.diagram-item').forEach(n=>n.classList.remove('selected'));
  const el=document.querySelector('[data-id="'+id+'"]');
  if(el)el.classList.add('selected');
  const c=C[id];
  if(!c)return;
  sel=id;
  const p=document.getElementById('infoPanel');
  let h='<h3>'+esc(c.name||id)+'</h3>';
  if(c.role)h+='<div class="info-label">Role</div><div class="info-text">'+esc(c.role)+'</div>';
  if(c.desc)h+='<div class="info-label">Description</div><div class="info-def">'+esc(c.desc)+'</div>';
  if(c.interview)h+='<div class="info-label">Interview Note</div><div class="info-interview">'+esc(c.interview)+'</div>';
  p.innerHTML=h;
  if(inIframe)window.parent.postMessage({type:'diagram-select',component:c},'*');
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// Tooltip for hover with linger support
const tip=document.createElement('div');
tip.style.cssText='position:fixed;background:#161b22;border:1px solid #252535;border-radius:6px;padding:10px 14px;font-size:.75rem;color:#e8e6e3;max-width:420px;pointer-events:auto;z-index:100;display:none;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.5)';
document.body.appendChild(tip);
let tipShowTimer=null;
let tipHideTimer=null;
let tipActive=false;

tip.addEventListener('mouseenter',()=>{clearTimeout(tipHideTimer);tipActive=true});
tip.addEventListener('mouseleave',()=>{tipActive=false;tipHideTimer=setTimeout(()=>{tip.style.display='none'},200)});

document.addEventListener('mouseover',function(e){
  const item=e.target.closest('.diagram-item[data-id]');
  if(!item)return;
  clearTimeout(tipHideTimer);
  clearTimeout(tipShowTimer);
  const id=item.getAttribute('data-id');
  const c=C[id];
  if(!c)return;
  tipShowTimer=setTimeout(()=>{
    let h='<strong style="color:#f0f6fc">'+esc(c.name||id)+'</strong>';
    if(c.role)h+='<span style="color:#7d8590;font-size:.68rem;margin-left:6px">'+esc(c.role)+'</span>';
    tip.innerHTML=h;
    tip.style.display='';
    tipActive=true;
    // Dynamic positioning: avoid cut-off on all edges
    const r=item.getBoundingClientRect();
    const tw=tip.offsetWidth;
    const th=tip.offsetHeight;
    let left=r.right+8;
    let top=r.top;
    // If overflows right, show on left side
    if(left+tw>window.innerWidth-8)left=r.left-tw-8;
    // If still overflows (very wide), clamp to viewport
    if(left<8)left=8;
    // Vertical: avoid bottom overflow
    if(top+th>window.innerHeight-8)top=window.innerHeight-th-8;
    if(top<8)top=8;
    tip.style.left=left+'px';
    tip.style.top=top+'px';
  },250);
});

document.addEventListener('mouseout',function(e){
  const item=e.target.closest('.diagram-item[data-id]');
  if(!item)return;
  clearTimeout(tipShowTimer);
  // Delay hiding so user can move mouse to tooltip
  tipHideTimer=setTimeout(()=>{
    if(!tipActive)tip.style.display='none';
  },300);
});


</script></body></html>
