meta:
  name: distributed_scream_norecovery_budget0_fluc_fast
  description: 'Distributed (aum→veda) SCReAM at 720p30 over

    `fluctuating-fast-5mbps-300kbps`. Recovery: none. Budget: 0.

    Minimal H1↔H4 cross-experiment comparison: same 2-arm SCReAM vs

    GCC setup that H1 used on this network, with H4''s late_drops

    metric included so we get receiver-side delivered frames.

    '
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - late_drops
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: ball-720p30
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 0
  network: fluctuating-fast-5mbps-300kbps
