meta:
  name: distributed_fluctuation
  description: "Distributed (aum\u2192veda) SCReAM under fluctuating-5mbps-300kbps.\
    \ Pair with config 10 for a head-to-head SCReAM-vs-GCC adaptation comparison."
  flags:
  - sudo
  - scream
video: ball-480p15
network: fluctuating-5mbps-300kbps
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
codec: vp8
encoder:
  bitrate_kbps: 500
  keyframe_interval_frames: 60
congestion_control:
  algorithm: scream
  init_bitrate_kbps: 500
  min_bitrate_kbps: 200
  max_bitrate_kbps: 4000
sink:
  backend: fake
  sync: false
recovery:
  nack: false
  pli: false
  fec: false
latency_budget_ms: 0
