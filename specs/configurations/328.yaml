meta:
  name: h13_keyframe_8
  description: "H13 cell \u2014 keyframe interval 8 frames at 1% loss on fixed 5 Mbps\
    \ / 20 ms, VP8 + SCReAM loose 4000 kbps, realmotion-avi, recovery off. Tests whether\
    \ a shorter GOP softens the loss cliff."
  flags:
  - scream
video: realmotion-avi
network: fixed-5mbps-20ms-loss1pct
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - wire_bytes
  - encoded_bitrate
  - frame_latency
  - decoder_errors
  - decoded_psnr
codec: vp8
encoder:
  bitrate_kbps: 1500
  keyframe_interval_frames: 8
congestion_control:
  algorithm: scream
  init_bitrate_kbps: 1500
  min_bitrate_kbps: 200
  max_bitrate_kbps: 4000
sink:
  backend: fake
  sync: false
recovery:
  nack: false
  pli: false
  fec: false
latency_budget_ms: 0
