meta:
  name: distributed_gcc
  description: "Distributed (aum\u2192veda) using Google Congestion Control (rtpgccbwe\
    \ + TWCC) instead of SCReAM. Mirror of config 7 for direct algorithm comparison.\
    \ Requires GStreamer 1.24 from build_gstreamer.sh on both hosts."
video: ball-480p15
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.5
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
codec: vp8
encoder:
  bitrate_kbps: 500
  keyframe_interval_frames: 60
congestion_control:
  algorithm: gcc
  init_bitrate_kbps: 500
  min_bitrate_kbps: 200
  max_bitrate_kbps: 4000
sink:
  backend: fake
  sync: false
recovery:
  nack: false
  pli: false
  fec: false
latency_budget_ms: 0
