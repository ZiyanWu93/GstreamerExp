meta:
  name: scream
  description: SCReAM congestion control wired in (loopback). Encoder ramps to its
    configured max because the link has no constraint.
  flags:
  - scream
scenario:
  actors:
    camera:
      host: 127.0.0.1
    viewer:
      host: 127.0.0.2
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: smpte-480p15
  codec: vp8
  encoder:
    bitrate_kbps: 500
    keyframe_interval_frames: 150
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 0
