meta:
  name: distributed_scream_filesource_psnr_smoke
  description: 'FileSource + decoded_psnr smoke. The viewer reproduces the camera''s

    source by decoding the same WebM file (staged at the same path on

    its own host) and pairs each received frame with its ground truth

    by PTS, so the PSNR metric measures real-content quality, not just

    frame counts. Same recovery / network as config 23, but with the

    motion-varied pinwheel clip via FileSource so vp8 actually has

    P-frame variance for recovery to defend against.

    '
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - decoded_psnr
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: teleop-realmotion
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: true
    pli: false
    fec: false
    rtx_buffer_ms: 500
  latency_budget_ms: 0
  network: fluctuating-5mbps-300kbps
