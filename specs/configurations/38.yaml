meta:
  name: distributed_scream_nack_budget50
  description: 'Distributed (aum→veda) SCReAM at 720p30 over

    `clean-5mbps-50ms-3pct-uniform`. Recovery: NACK + RTX.

    Latency budget: 50 ms (tighter than the 100 ms RTT, so any

    NACK retransmission round-trip exceeds the budget).

    Follow-up arm to the H4 experiment `nack-latency-budget`,

    testing whether the H4 prediction holds at a budget tighter

    than the network''s RTT.

    '
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - late_drops
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: ball-720p30
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: true
    pli: false
    fec: false
    rtx_buffer_ms: 500
  latency_budget_ms: 50
  network: clean-5mbps-50ms-3pct-uniform
