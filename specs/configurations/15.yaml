meta:
  name: distributed_scream_720p_pli
  description: Distributed (aum→veda) SCReAM at 720p30 under fluctuating-5mbps-300kbps,
    with PLI but without NACK + RTX. Pair with configs 13/14/16 for the 2x2 study
    isolating PLI versus packet retransmission.
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: ball-720p30
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: true
    fec: false
  latency_budget_ms: 0
  network: fluctuating-5mbps-300kbps
