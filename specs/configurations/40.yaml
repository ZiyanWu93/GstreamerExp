meta:
  name: distributed_gcc_nack_budget50
  description: "Distributed (aum\u2192veda) GCC at 720p30 over\n`clean-5mbps-50ms-3pct-uniform`.\
    \ Recovery: NACK + RTX.\nLatency budget: 50 ms (tighter than the 100 ms RTT, so\
    \ any\nNACK retransmission round-trip exceeds the budget).\nFollow-up arm to the\
    \ H4 experiment `nack-latency-budget`,\ntesting whether the H4 prediction holds\
    \ at a budget tighter\nthan the network's RTT.\n"
  flags:
  - sudo
  - gcc
video: ball-720p30
network: clean-5mbps-50ms-3pct-uniform
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - late_drops
codec: vp8
encoder:
  bitrate_kbps: 1500
  keyframe_interval_frames: 60
congestion_control:
  algorithm: gcc
  init_bitrate_kbps: 1500
  min_bitrate_kbps: 200
  max_bitrate_kbps: 4000
sink:
  backend: fake
  sync: false
recovery:
  nack: true
  pli: false
  fec: false
  rtx_buffer_ms: 500
latency_budget_ms: 50
