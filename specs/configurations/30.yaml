meta:
  name: distributed_scream_nack_budget0
  description: 'Distributed (aum→veda) SCReAM at 720p30 over

    `clean-5mbps-50ms-3pct-uniform`. Recovery: NACK + RTX.

    Latency budget: 0 ms (no enforcement; all frames delivered regardless of age).
    One arm of the H4 experiment

    `nack-latency-budget` — 8-arm 2×2×2 over (CC algorithm) ×

    (NACK on/off) × (budget 0 / 100 ms).

    '
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - late_drops
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: ball-720p30
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: true
    pli: false
    fec: false
    rtx_buffer_ms: 500
  latency_budget_ms: 0
  network: clean-5mbps-50ms-3pct-uniform
