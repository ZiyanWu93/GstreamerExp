meta:
  name: fluctuation
  description: SCReAM + time-varying impairment in three steps (good → severe → recover)
    showing live bitrate adaptation in two Linux network namespaces.
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera:
      host: 10.0.0.1
      wrap:
      - sudo
      - ip
      - netns
      - exec
      - ns_tx
    viewer:
      host: 10.0.0.2
      wrap:
      - sudo
      - ip
      - netns
      - exec
      - ns_rx
  setup_delay_seconds: 2.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: ball-480p15
  codec: vp8
  encoder:
    bitrate_kbps: 500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 0
hooks:
  pre_run:
    host: local
    sudo: true
    script: "# Two network namespaces (ns_tx, ns_rx) connected by a veth pair, with\n\
      # initial impairment of 5 Mbps + 20 ms delay. The during_run hook\n# changes\
      \ these qdiscs over time.\nset -e\n\nNS_TX=ns_tx\nNS_RX=ns_rx\nTX_IP=10.0.0.1\n\
      RX_IP=10.0.0.2\n\nip netns del $NS_TX 2>/dev/null || true\nip netns del $NS_RX\
      \ 2>/dev/null || true\n\nip netns add $NS_TX\nip netns add $NS_RX\n\nip link\
      \ add veth_tx type veth peer name veth_rx\nip link set veth_tx netns $NS_TX\n\
      ip link set veth_rx netns $NS_RX\n\nip netns exec $NS_TX ip addr add $TX_IP/24\
      \ dev veth_tx\nip netns exec $NS_RX ip addr add $RX_IP/24 dev veth_rx\nip netns\
      \ exec $NS_TX ip link set veth_tx up\nip netns exec $NS_RX ip link set veth_rx\
      \ up\nip netns exec $NS_TX ip link set lo up\nip netns exec $NS_RX ip link set\
      \ lo up\n\nfor ns_dev in \"$NS_TX:veth_tx\" \"$NS_RX:veth_rx\"; do\n    NS=${ns_dev%:*}\n\
      \    DEV=${ns_dev#*:}\n    ip netns exec $NS tc qdisc add dev $DEV root handle\
      \ 1: netem delay 20ms\n    ip netns exec $NS tc qdisc add dev $DEV parent 1:1\
      \ handle 2: tbf rate 5mbit burst 32kbit latency 50ms\ndone\n\necho \"namespaces\
      \ ready: $NS_TX ($TX_IP) <-> $NS_RX ($RX_IP), initial bw=5mbit, delay=20ms\"\
      \n"
  during_run:
    host: local
    sudo: true
    script: "# Three steps over ~20 s, applied to ns_tx's egress veth:\n#   t=0..7s\
      \   : 5 Mbps,   20 ms              (initial)\n#   t=7..13s  : 300 kbps, 100\
      \ ms, 2% loss    (severe drop)\n#   t=13..20s : 5 Mbps,   20 ms            \
      \  (recovery)\nset -e\n\napply() {\n    local rate=\"$1\" burst=\"$2\" netem=\"\
      $3\"\n    ip netns exec ns_tx tc qdisc change dev veth_tx root handle 1: netem\
      \ $netem\n    ip netns exec ns_tx tc qdisc change dev veth_tx parent 1:1 handle\
      \ 2: tbf rate $rate burst $burst latency 50ms\n    echo \"[fluctuate] $(date\
      \ +%H:%M:%S) -> rate=$rate netem=$netem\"\n}\n\nsleep 7\napply  300kbit  8kbit\
      \  \"delay 100ms loss 2%\"\n\nsleep 6\napply  5mbit    32kbit \"delay 20ms\"\
      \n"
  post_run:
    host: local
    sudo: true
    script: 'ip netns del ns_tx 2>/dev/null || true

      ip netns del ns_rx 2>/dev/null || true

      echo "namespaces removed"

      '
