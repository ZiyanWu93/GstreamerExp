meta:
  name: distributed_gcc_norecovery_budget100
  description: 'Distributed (aum→veda) GCC at 720p30 over

    `clean-5mbps-50ms-3pct-uniform`. Recovery: none (no NACK, no PLI, no FEC).

    Latency budget: 100 ms enforced (frames older than 100 ms at the viewer sink are
    dropped). One arm of the H4 experiment

    `nack-latency-budget` — 8-arm 2×2×2 over (CC algorithm) ×

    (NACK on/off) × (budget 0 / 100 ms).

    '
  flags:
  - sudo
  - gcc
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - late_drops
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: ball-720p30
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: gcc
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 100
  network: clean-5mbps-50ms-3pct-uniform
