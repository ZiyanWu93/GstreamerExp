meta:
  name: h6_qdt_30_static
  description: H6 cell — queue-delay-target 30 ms on fixed-5mbps-20ms, VP8 + SCReAM
    ceiling 4000 kbps, streaming realmotion-avi.
  flags:
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - wire_bytes
  - encoded_bitrate
  - frame_latency
  - decoder_errors
  - decoded_psnr
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: realmotion-avi
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
    scream:
      delay_target_seconds: 0.03
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 0
  network: fixed-5mbps-20ms
