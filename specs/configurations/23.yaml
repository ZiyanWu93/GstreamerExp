meta:
  name: distributed_scream_smpte_psnr_smoke
  description: 'Smoke test for the decoded_psnr metric. Synthetic SMPTE pattern at

    640x480x15fps (deterministic, reproducible at the viewer; no clock

    overlay), SCReAM, NACK on. The decoded_psnr metric computes per-frame

    Y-plane PSNR vs a viewer-side ground-truth videotestsrc pipeline.

    Once verified, the same metric can be added to the recovery 2x2 to

    measure quality, not just frame count.

    '
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - decoded_psnr
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: smpte-480p15
  codec: vp8
  encoder:
    bitrate_kbps: 500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: true
    pli: false
    fec: false
    rtx_buffer_ms: 500
  latency_budget_ms: 0
  network: fluctuating-5mbps-300kbps
