meta:
  name: distributed_gcc_720p
  description: "Distributed (aum\u2192veda) GCC at 720p30 under fluctuating-5mbps-300kbps.\
    \ Mirror of config 11. Pair the two to compare controllers under a workload that\
    \ actually binds against the impairment cap."
  flags:
  - sudo
video: ball-720p30
network: fluctuating-fast-5mbps-300kbps
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
codec: vp8
encoder:
  bitrate_kbps: 1500
  keyframe_interval_frames: 60
congestion_control:
  algorithm: gcc
  init_bitrate_kbps: 1500
  min_bitrate_kbps: 200
  max_bitrate_kbps: 4000
sink:
  backend: fake
  sync: false
recovery:
  nack: false
  pli: false
  fec: false
latency_budget_ms: 0
