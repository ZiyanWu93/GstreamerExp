meta:
  name: distributed_gcc_5g_ho_nack1_budget0
  description: 'Distributed (aum->veda) GCC at 720p30 over `mahimahi-5g-ho-100ms`.
    Video uses 915 frames to cover the full ~30.5s trace. Recovery: NACK + RTX. Latency
    budget: 0 ms.'
  flags:
  - sudo
  - gcc
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - late_drops
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: ball-720p30-30s
  codec: vp8
  encoder:
    bitrate_kbps: 1500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: gcc
    init_bitrate_kbps: 1500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: true
    pli: false
    fec: false
    rtx_buffer_ms: 500
  latency_budget_ms: 0
  network: mahimahi-5g-ho-100ms
