meta:
  name: distributed_scream_720p_realmotion_nonack
  description: "Distributed (aum\u2192veda) SCReAM at 720p30 under fluctuating-5mbps-300kbps,\
    \ explicitly without NACK + RTX. Mirrors config 13 except for recovery.nack; pair\
    \ the two to isolate the effect of packet recovery."
  flags:
  - sudo
  - scream
video: teleop-realmotion
network: fluctuating-5mbps-300kbps
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
codec: vp8
encoder:
  bitrate_kbps: 1500
  keyframe_interval_frames: 60
congestion_control:
  algorithm: scream
  init_bitrate_kbps: 1500
  min_bitrate_kbps: 200
  max_bitrate_kbps: 4000
sink:
  backend: fake
  sync: false
recovery:
  nack: false
  pli: false
  fec: false
latency_budget_ms: 0
