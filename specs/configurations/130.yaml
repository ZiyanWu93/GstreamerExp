meta:
  name: h7_qdt_500_fluct
  description: H7 cell — queue-delay-target 500 ms on fluctuating-5mbps-300kbps, VP8
    + SCReAM ceiling 800 kbps, streaming realmotion-avi.
  flags:
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - wire_bytes
  - encoded_bitrate
  - frame_latency
  - decoder_errors
  - decoded_psnr
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: realmotion-avi
  codec: vp8
  encoder:
    bitrate_kbps: 500
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 500
    min_bitrate_kbps: 200
    max_bitrate_kbps: 800
    scream:
      delay_target_seconds: 0.5
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 0
  network: fluctuating-5mbps-300kbps
