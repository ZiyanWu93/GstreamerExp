meta:
  name: psnr_sanity_clean_lossless
  description: 'PSNR ground-truth sanity check. Clean loopback (no impairment), near-lossless
    encode (high ceiling, high init), realmotion-avi. If decoded_psnr here is ~10
    dB the truth pipeline is misaligned; if ~40 dB the metric is sound. Not part of
    any sweep.

    '
  flags:
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - wire_bytes
  - encoded_bitrate
  - frame_latency
  - decoder_errors
  - decoded_psnr
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: realmotion-avi
  codec: vp8
  encoder:
    bitrate_kbps: 20000
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 20000
    min_bitrate_kbps: 2000
    max_bitrate_kbps: 40000
    scream:
      delay_target_seconds: 0.5
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 0
  network: loopback
