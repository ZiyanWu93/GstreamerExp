meta:
  name: distributed_scream_5g_cqi_x0p33_snow_384x216
  description: Distributed (aum->veda) SCReAM over `mahimahi-5g-cqi-100ms-x0p33` using
    calibrated 384x216x30 snow video.
  flags:
  - sudo
  - scream
scenario:
  actors:
    camera: {}
    viewer: {}
  setup_delay_seconds: 3.0
  drain_delay_seconds: 1.0
  metrics:
  - frame_count
  - encoder_target_kbps
  - frame_latency
  - wire_bytes
  - encoded_bitrate
  - decoder_errors
  - late_drops
sync:
  mode: shared_epoch
  termination: all
streams:
- name: main
  priority: 0
  video: snow-384x216-30s
  codec: vp8
  encoder:
    bitrate_kbps: 1000
    keyframe_interval_frames: 60
  congestion_control:
    algorithm: scream
    init_bitrate_kbps: 1000
    min_bitrate_kbps: 100
    max_bitrate_kbps: 4000
  sink:
    backend: fake
    sync: false
  recovery:
    nack: false
    pli: false
    fec: false
  latency_budget_ms: 0
  network: mahimahi-5g-cqi-100ms-x0p33
