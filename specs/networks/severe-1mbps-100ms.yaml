name: severe-1mbps-100ms
description: "Heavier three-step impairment than fluctuating-5mbps-300kbps:\n  t=0..5s\
  \   : 5 Mbps,   20 ms                              (good)\n  t=5..15s  : 1 Mbps,\
  \  100 ms, 5% uniform iid loss         (severe; longer + more loss)\n  t=15..20s\
  \ : 5 Mbps,   20 ms                              (recovery)\nDesigned to bind on\
  \ encoder workloads in the 500 kbps \u2013 2 Mbps range.\nThe configuration must\
  \ set the interface name via\n`network_env: { NIC: <ifname> }`.\n"
