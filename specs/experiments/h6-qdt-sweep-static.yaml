name: h6-qdt-sweep-static
description: |
  H6 — SCReAM queue-delay-target sweep on the fixed-5mbps-20ms regime,
  with realmotion-avi as the workload. Six knob values {10, 30, 60, 100,
  200, 500} ms, three reps each.
reps: 3
varies:
  - streams[0].congestion_control.scream.delay_target_seconds
configurations:
  - id: 101
    label: qdt 10ms
    color: "#fee5d9"
  - id: 102
    label: qdt 30ms
    color: "#fcae91"
  - id: 103
    label: qdt 60ms
    color: "#fb6a4a"
  - id: 104
    label: qdt 100ms
    color: "#de2d26"
  - id: 105
    label: qdt 200ms
    color: "#a50f15"
  - id: 106
    label: qdt 500ms
    color: "#67000d"
