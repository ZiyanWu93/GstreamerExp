name: retransmission-deadline-fluc
description: |
  H4 — SCReAM vs GCC across three latency deadlines, on the
  fluctuating-5mbps-300kbps network. 12-arm 2×2×2 over
  (CC algorithm) × (retransmission on/off) × (budget 0 / 50 / 100 ms).

  Replaces the earlier constant-network experiment with a more
  realistic capacity-step network: 5 Mbps clean for 7 s, drop to
  300 kbps + 2% loss for 6 s, recover to 5 Mbps for 7 s. The loss
  happens during the bottleneck phase, where retransmission has the
  most work to do but also the least bandwidth to do it on.

  Predictions tested on this page:
  1. SCReAM produces more frames than GCC on a fluctuating network
     (consistent with H1).
  2. Retransmission's frame-count benefit shrinks under tight
     deadlines (consistent with the constant-network finding).
  3. The SCReAM-vs-GCC ranking may reverse at tight deadlines if
     SCReAM's lateness tail is larger than GCC's.
reps: 5
varies:
  - streams[0].congestion_control.algorithm
  - streams[0].recovery.nack
  - streams[0].recovery.rtx_buffer_ms
  - streams[0].latency_budget_ms
