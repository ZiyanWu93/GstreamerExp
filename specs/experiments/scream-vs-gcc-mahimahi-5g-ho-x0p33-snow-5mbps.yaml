name: scream-vs-gcc-mahimahi-5g-ho-x0p33-snow-5mbps
description: >
  SCReAM vs GCC on the translated 5G Mahimahi handover-like trace scaled
  to 33% capacity, using a high-entropy 720p30 snow workload targeting 5 Mbps.
  This preserves the real trace shape while making the media load exceed the
  trace capacity for a meaningful congestion-control comparison.
reps: 3
varies:
- congestion_control.algorithm
