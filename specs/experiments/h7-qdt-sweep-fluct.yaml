name: h7-qdt-sweep-fluct
description: |
  H7 — SCReAM queue-delay-target sweep at a tight bitrate ceiling (max
  800 kbps) on the fluctuating-5mbps-300kbps network, streaming
  realmotion-avi. Six knob values {10, 30, 60, 100, 200, 500} ms, three
  reps each.
reps: 3
varies:
  - streams[0].congestion_control.scream.delay_target_seconds
configurations:
  - id: 125
    label: qdt 10ms
    color: "#bdd7e7"
  - id: 126
    label: qdt 30ms
    color: "#6baed6"
  - id: 127
    label: qdt 60ms
    color: "#3182bd"
  - id: 128
    label: qdt 100ms
    color: "#08519c"
  - id: 129
    label: qdt 200ms
    color: "#08306b"
  - id: 130
    label: qdt 500ms
    color: "#031c4d"
