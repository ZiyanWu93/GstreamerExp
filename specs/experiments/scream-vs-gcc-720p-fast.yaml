name: scream-vs-gcc-720p-fast
description: |
  SCReAM vs GCC at 720p30 against fluctuating-fast-5mbps-300kbps —
  the same workload as scream-vs-gcc-720p but the network alternates
  between 5 Mbps clean and 300 kbps + 2% loss every 2 seconds (10
  phases instead of 3). Companion to scream-vs-gcc-720p; pair the
  two to separate steady-state utilization (sparse impairment regime)
  from adaptation responsiveness (frequent impairment regime).
reps: 10
varies:
  - streams[0].congestion_control.algorithm
configurations:
  - id: 27
    label: SCReAM
    color: "#d62728"
  - id: 28
    label: GCC
    color: "#1f77b4"
