name: h6-qdt-sweep-fluct
description: |
  H6 — SCReAM queue-delay-target sweep on the fluctuating-5mbps-300kbps
  regime, with realmotion-avi as the workload. Six knob values {10, 30,
  60, 100, 200, 500} ms, three reps each.
reps: 3
varies:
  - streams[0].congestion_control.scream.delay_target_seconds
configurations:
  - id: 107
    label: qdt 10ms
    color: "#bdd7e7"
  - id: 108
    label: qdt 30ms
    color: "#6baed6"
  - id: 109
    label: qdt 60ms
    color: "#3182bd"
  - id: 110
    label: qdt 100ms
    color: "#08519c"
  - id: 111
    label: qdt 200ms
    color: "#08306b"
  - id: 112
    label: qdt 500ms
    color: "#031c4d"
