name: h13-keyframe-loss
description: "H13 \u2014 keyframe-interval sweep at a fixed 1% packet loss (H10's recovery-off\ncell),\
  \ holding everything else constant and varying only the VP8 keyframe\ninterval over {60, 30, 15, 8,\
  \ 4, 2} frames. Three reps each. Tests the loss-\ncollapse diagnostic's prediction that a shorter GOP\
  \ softens the cliff by\nbounding the reference-chain desync window.\n"
reps: 3
varies:
- encoder.keyframe_interval_frames
configurations:
- id: 325
  label: 60 frames
  color: '#67000d'
- id: 326
