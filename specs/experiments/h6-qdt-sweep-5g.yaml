name: h6-qdt-sweep-5g
description: |
  H6 — SCReAM queue-delay-target sweep on the mahimahi-5g-cqi-100ms-x0p33
  regime (real 5G CQI capacity trace, scaled to 33%), with realmotion-avi
  as the workload. Six knob values {10, 30, 60, 100, 200, 500} ms, three
  reps each.
reps: 3
varies:
  - congestion_control.scream.delay_target_seconds
