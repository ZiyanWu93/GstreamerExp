    topology: controller-worker
    hosts: { camera: aum, viewer: veda }
    shaper: tc-qdisc
    workload: realmotion-avi
  experiments:
    - name: h9-rtt-boundary
      configurations: [301, 302, 303, 304, 305, 306]
      role: rtt-boundary-single-arm
      minimum_completed_reps: 3
  required_metrics:
