id: H9
slug: h9
title: Where rising delay breaks SCReAM's control
claim: SCReAM is a delay-based congestion controller, so growing base path delay should be the stressor that breaks it first. On a fixed 5 Mbps link with no loss, as the one-way delay rises from 20 ms toward 800 ms, SCReAM's decoded picture quality should stay usable at low delay and then fall off past some delay, marking a degeneration boundary. If quality instead holds flat across the whole range, SCReAM tolerates delays up to 800 ms here and no boundary exists in this range.
status: supported
source: Goal 2 boundary behaviour (§7.8)
page: analysis/hypotheses/h9.html
verifier: analysis/hypotheses/h9_rtt_boundary.py
predictions:
  - usable_quality_at_low_delay
  - quality_degrades_across_the_delay_range
  - degeneration_threshold_found_below_max_delay
verdict:
  supported_when_all:
    - usable_quality_at_low_delay
    - quality_degrades_across_the_delay_range
  refuted_when_any:
    - quality_robust_across_whole_range
  untested_when_any:
