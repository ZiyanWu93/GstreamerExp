id: H10
slug: h10
title: Where packet loss breaks SCReAM's quality
claim: With loss recovery off, a lost packet corrupts VP8 until the next keyframe (60 frames here), so packet loss should break delivery at a low rate. On a fixed 5 Mbps / 20 ms link, as uniform iid loss rises from 0 to 2 percent, frame delivery (frames the viewer reconstructs over frames the camera sent) should stay high at low loss and collapse past some rate, marking a degeneration boundary. PSNR of the frames that do arrive is reported alongside but is not the boundary signal, since the survivors stay clean. If delivery holds across the range, the system tolerates up to 2 percent loss here.
status: untested
source: Goal 2 boundary behaviour (§7.8)
page: analysis/hypotheses/h10.html
verifier: analysis/hypotheses/h10_loss_boundary.py
predictions:
  - usable_delivery_at_zero_loss
  - delivery_collapses_across_the_loss_range
  - usable_threshold_found_below_max_loss
verdict:
  supported_when_all:
    - usable_delivery_at_zero_loss
    - delivery_collapses_across_the_loss_range
  refuted_when_any:
    - delivery_robust_across_whole_range
  untested_when_any:
    - any_cell_failed
    - required_metric_missing
setup:
  environment:
    topology: controller-worker
    hosts: { camera: aum, viewer: veda }
    shaper: tc-qdisc
    workload: realmotion-avi
  experiments:
    - name: h10-loss-boundary
      configurations: [307, 308, 309, 310, 311, 312]
      role: loss-boundary-single-arm
      minimum_completed_reps: 3
  required_metrics:
    - frame_count
    - encoder_target_kbps
    - wire_bytes
    - encoded_bitrate
    - frame_latency
    - decoder_errors
    - decoded_psnr
results:
  expected_records:
    - runs/experiments/h10-loss-boundary.json
  report: analysis/hypotheses/results/h10_report.json
conclusions:
  established: []
  limits:
    - Pre-registered: predictions and the verdict rule are fixed before the run. Results are pending the sweep on the aum/veda testbed.
    - Recovery is off (nack/pli/fec false), matching H6-H9. This measures the raw loss sensitivity of SCReAM + VP8 with no retransmission; with NACK/RTX on the boundary would move substantially, and that contrast is itself worth a follow-up.
    - Single arm (only scream|gcc exist, no bare sender), so the boundary is read off SCReAM's own quality-vs-loss curve.
    - Uniform iid loss is swept {0, 0.1, 0.25, 0.5, 1, 2} %; a bursty (Gilbert-Elliott) loss model would degrade differently at the same mean rate.
    - Workload-specific (realmotion-avi, 1280x1024 MJPEG, 10 fps, 60 s), 4000 kbps ceiling, keyframe interval 60 frames. 3 reps per cell. Boundary signal is frame delivery: usable line at 80% delivery, collapse below 50%.
