id: H10
slug: h10
title: Where packet loss breaks SCReAM's quality
claim: With loss recovery off, a lost packet corrupts VP8 until the next keyframe (60 frames here), so packet loss should break delivery at a low rate. On a fixed 5 Mbps / 20 ms link, as uniform iid loss rises from 0 to 2 percent, frame delivery (frames the viewer reconstructs over frames the camera sent) should stay high at low loss and collapse past some rate, marking a degeneration boundary. PSNR of the frames that do arrive is reported alongside but is not the boundary signal, since the survivors stay clean. If delivery holds across the range, the system tolerates up to 2 percent loss here.
status: supported
source: Goal 2 boundary behaviour (§7.8)
page: analysis/hypotheses/h10.html
verifier: analysis/hypotheses/h10_loss_boundary.py
predictions:
  - usable_delivery_at_zero_loss
  - delivery_collapses_across_the_loss_range
  - usable_threshold_found_below_max_loss
verdict:
  supported_when_all:
    - usable_delivery_at_zero_loss
    - delivery_collapses_across_the_loss_range
  refuted_when_any:
    - delivery_robust_across_whole_range
  untested_when_any:
    - any_cell_failed
    - required_metric_missing
setup:
  environment:
    topology: controller-worker
    hosts: { camera: aum, viewer: veda }
    shaper: tc-qdisc
    workload: realmotion-avi
  experiments:
    - name: h10-loss-boundary
      configurations: [307, 308, 309, 310, 311, 312]
      role: loss-boundary-single-arm
      minimum_completed_reps: 3
  required_metrics:
    - frame_count
    - encoder_target_kbps
    - wire_bytes
    - encoded_bitrate
    - frame_latency
    - decoder_errors
    - decoded_psnr
results:
  expected_records:
    - runs/experiments/h10-loss-boundary.json
  report: analysis/hypotheses/results/h10_report.json
conclusions:
  established:
    - Without loss recovery, the system cannot tolerate even 0.1% packet loss. Frame delivery falls from 96% at 0% loss to 36% at 0.1%, 28% at 0.25%, 23% at 0.5%, 18% at 1%, and 17% at 2%. The usable line (80% delivery) is already crossed below 0.1%, so the recovery-off loss boundary is effectively zero.
    - Both signals degrade, delivery first. PSNR of the frames that do arrive also falls (39.4 dB at 0% loss, then 30.0, 26.4, 23.8, 18.9, 18.3 dB) because corruption propagates into some delivered frames, but the dominant effect is missing frames, not blurry ones -- a lost packet corrupts VP8 until the next keyframe (6 s here), so each loss costs many frames.
    - The cause is now isolated (a mechanism diagnostic on the 1% run), and it reframes the finding. The transport is healthy -- the sender transmits all 600 frames, the wire delivers 98.4% of bytes (14.60 of 14.83 MB), and 586 of 600 frames reach the receiver's network ingress. The entire 98%-to-18% collapse happens in the receiver chain (rtpjitterbuffer then rtpvp8depay), where a single early loss-induced packet gap breaks VP8's inter-frame prediction and the stream never re-anchors -- decoded output runs clean off keyframe 0, then ceases around frame 105 and does NOT re-lock at the later keyframes (120, 180, 240 ...) even though packets keep arriving for the full 59 s. So this is not a SCReAM loss-tolerance limit (SCReAM and the wire deliver fine) and not a missing-recovery gap (H12 confirmed recovery does not move it); it is a VP8 long-GOP plus non-re-anchoring receiver effect. frames_depayloaded is an honest but strict complete-decodable-frame proxy, and the 60-frame keyframe interval gives the stream almost no chance to recover from one gap. The cliff is real for THIS codec/GOP/jitterbuffer config but is partly a setup artifact, not an intrinsic transport limit -- a keyframe-interval sweep (60 vs 15 vs 5) should soften it.
  limits:
    - Recovery is off (nack/pli/fec false), matching H6-H9. This measures the raw loss sensitivity of SCReAM + VP8 with no retransmission; with NACK/RTX on the boundary would move substantially, and that contrast is itself worth a follow-up.
    - Single arm (only scream|gcc exist, no bare sender), so the boundary is read off SCReAM's own quality-vs-loss curve.
    - Uniform iid loss is swept {0, 0.1, 0.25, 0.5, 1, 2} %; a bursty (Gilbert-Elliott) loss model would degrade differently at the same mean rate.
    - Workload-specific (realmotion-avi, 1280x1024 MJPEG, 10 fps, 60 s), 4000 kbps ceiling, keyframe interval 60 frames. 3 reps per cell. Boundary signal is frame delivery: usable line at 80% delivery, collapse below 50%.
