id: H3
slug: h3
title: Is the test video heavy enough?
claim: The current test video (ball-720p30) sends nowhere near enough data to use up the bandwidth in the 5G recordings, so any controller comparison on those recordings is not yet meaningful.
status: supported
source: Project-internal validity check for 5G-recording SCReAM / GCC experiments
page: analysis/hypotheses/h3.html
verifier: analysis/hypotheses/h3_media_workload_calibration.py
predictions:
  - every_5g_recording_has_at_least_10x_more_capacity_than_the_camera_actually_sends
  - on_every_recording_fewer_than_15_percent_of_100ms_windows_drop_below_1mbps_of_actual_sent_bytes
verdict:
  supported_when_all:
    - every_5g_recording_has_at_least_10x_more_capacity_than_the_camera_actually_sends
    - on_every_recording_fewer_than_15_percent_of_100ms_windows_drop_below_1mbps_of_actual_sent_bytes
  refuted_when_any:
    - no_recording_passes_either_check
  inconclusive_when_any:
    - some_recordings_pass_only_one_check
  untested_when_any:
    - required_records_missing
setup:
  environment:
    topology: controller-worker
    hosts: { controller: workstation, camera: aum, viewer: veda }
    transport: tailscale
    shaper: mahimahi
    workload: ball-720p30
  experiments:
    - name: scream-vs-gcc-mahimahi-5g-cqi
      configurations: [55, 56]
      role: cqi-recording-calibration
      command: python3 experiment.py scream-vs-gcc-mahimahi-5g-cqi
    - name: scream-vs-gcc-mahimahi-5g-ho
      configurations: [57, 58]
      role: handover-recording-calibration
      command: python3 experiment.py scream-vs-gcc-mahimahi-5g-ho
      log: runs/experiment-logs/scream-vs-gcc-mahimahi-5g-ho.log
    - name: scream-vs-gcc-mahimahi-5g-rb
      configurations: [59, 60]
      role: resource-block-recording-calibration
      command: python3 experiment.py scream-vs-gcc-mahimahi-5g-rb
      log: runs/experiment-logs/scream-vs-gcc-mahimahi-5g-rb.log
  required_metrics:
    - wire_bytes
    - encoded_bitrate
    - frame_count
results:
  expected_records:
    - runs/experiments/scream-vs-gcc-mahimahi-5g-cqi.json
    - runs/experiments/scream-vs-gcc-mahimahi-5g-ho.json
    - runs/experiments/scream-vs-gcc-mahimahi-5g-rb.json
  report: analysis/hypotheses/results/h3_report.json
  figures:
    - analysis/hypotheses/results/h3_capacity_headroom.svg
    - analysis/hypotheses/results/h3_ho_headroom_timeseries.svg
  tables:
    - headroom
conclusions:
  established:
    - The current ball-720p30 test video sends about 220–230 kbit / s, well below the typical bandwidth in the translated 5G recordings.
    - Earlier 5G-recording SCReAM / GCC comparisons cannot be read as meaningful algorithm comparisons.
    - Any future 5G-recording comparison must first pass this calibration with a test video that actually keeps the link busy.
  limits:
    - This shows the current test video is too light. It does not yet test a heavier replacement.
    - Brief low-capacity dips still happen in the handover-like recordings; the claim is about typical bandwidth across the whole replay.
