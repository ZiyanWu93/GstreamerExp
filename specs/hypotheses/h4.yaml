id: H4
slug: h4
title: Usable video on tight 5G
claim: On 5G recordings squeezed to one-third of their original capacity, SCReAM delivers more decoded frames to the viewer than GCC does, while the camera actually sends fewer bytes — on the two harder recordings (handover and resource-block).
status: supported
source: Project-internal 5G-recording SCReAM / GCC experiment
page: analysis/hypotheses/h4.html
verifier: analysis/hypotheses/h4_scream_realistic_trace_advantage.py
predictions:
  - scream_delivers_at_least_25_percent_more_viewer_frames_than_gcc_on_both_harder_recordings
  - on_both_harder_recordings_camera_sends_no_more_than_85_percent_of_what_gcc_sends
  - viewer_receives_within_10_percent_of_gcc_bytes_on_both_harder_recordings
  - scream_delivers_at_least_2x_viewer_frames_on_at_least_one_harder_recording
  - on_the_high_capacity_recording_both_algorithms_deliver_nearly_all_frames
verdict:
  supported_when_all:
    - scream_delivers_at_least_25_percent_more_viewer_frames_than_gcc_on_both_harder_recordings
    - on_both_harder_recordings_camera_sends_no_more_than_85_percent_of_what_gcc_sends
    - viewer_receives_within_10_percent_of_gcc_bytes_on_both_harder_recordings
    - scream_delivers_at_least_2x_viewer_frames_on_at_least_one_harder_recording
  refuted_when_any:
    - any_threshold_violated_on_completed_records
  untested_when_any:
    - required_records_missing
    - required_summaries_missing
setup:
  environment:
    topology: controller-worker
    hosts: { controller: workstation, camera: aum, viewer: veda }
    transport: tailscale
    shaper: mahimahi
    workload: snow-384x216
  experiments:
    - name: scream-vs-gcc-mahimahi-5g-cqi-x0p33-snow-384x216
      configurations: [81, 82]
      role: high-capacity-control
      command: python3 experiment.py scream-vs-gcc-mahimahi-5g-cqi-x0p33-snow-384x216
    - name: scream-vs-gcc-mahimahi-5g-ho-x0p33-snow-384x216
      configurations: [79, 80]
      role: handover-recording
      command: python3 experiment.py scream-vs-gcc-mahimahi-5g-ho-x0p33-snow-384x216
    - name: scream-vs-gcc-mahimahi-5g-rb-x0p33-snow-384x216
      configurations: [83, 84]
      role: resource-block-recording
      command: python3 experiment.py scream-vs-gcc-mahimahi-5g-rb-x0p33-snow-384x216
  required_metrics:
    - frame_count
    - encoder_target_kbps
    - frame_latency
    - wire_bytes
    - encoded_bitrate
    - decoder_errors
    - late_drops
results:
  expected_records:
    - runs/experiments/scream-vs-gcc-mahimahi-5g-cqi-x0p33-snow-384x216.json
    - runs/experiments/scream-vs-gcc-mahimahi-5g-ho-x0p33-snow-384x216.json
    - runs/experiments/scream-vs-gcc-mahimahi-5g-rb-x0p33-snow-384x216.json
  report: analysis/hypotheses/results/h4_report.json
  figures:
    - analysis/hypotheses/results/h4_frame_delivery_by_trace.svg
    - analysis/hypotheses/results/h4_camera_egress_by_trace.svg
    - analysis/hypotheses/results/h4_cqi_timeseries.svg
    - analysis/hypotheses/results/h4_ho_timeseries.svg
    - analysis/hypotheses/results/h4_rb_timeseries.svg
  tables:
    - h4_arm_summary
    - h4_trace_comparison
conclusions:
  established:
    - On the high-capacity recording (CQI), both algorithms deliver nearly all frames; this recording acts as the easy control.
    - On the handover recording, SCReAM delivers about 2.7x as many frames to the viewer as GCC, while the camera sends fewer bytes.
    - On the resource-block recording, SCReAM delivers about 1.4x as many frames to the viewer as GCC, while the camera sends fewer bytes.
    - GCC's target bitrate does drop on the tighter recordings, but in this pipeline that lower target does not turn into fewer bytes leaving the camera.
    - The result is meaningful because the test video is now heavy enough to actually keep the recordings busy (the H3 calibration issue is fixed for this experiment).
  limits:
    - One test video, fixed recording, one set of bitrate bounds. The CQI recording shows SCReAM has no visible frame-delivery edge when the link has enough room for both algorithms.
    - The latency numbers still have a clock-skew artifact between aum and veda. H4's main claim is frame delivery and camera bytes, not latency.
