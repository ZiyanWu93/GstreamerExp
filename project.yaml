id: gstexp
title: GstreamerExp
project_category: workspaces
management_status: managed
summary: >
  Real-time GStreamer video pipeline experiment testbed with declarative specs,
  falsifiable hypotheses, local runners, generated reports, and a static
  project-local static viewer.
project_profile:
  goal:
    purpose: >
      Build and characterize a real-time GStreamer video pipeline so claims
      about congestion control, recovery, quality, latency, adaptation, and
      stability can be tested from preserved run records.
    scope: >
      Local and distributed GStreamer VP8/RTP/UDP experiments driven by
      declarative video, network, configuration, experiment, and hypothesis
      specs. The project does not claim universal video or cellular behavior
      beyond the tested workloads, networks, codecs, and hosts.
    standing_questions:
      - How does the pipeline behave under controlled network stress?
      - Which claims about SCReAM, GCC, recovery, and workload sensitivity survive verifier-backed experiments?
      - Which metrics expose throughput, quality, latency, adaptation, and stability without conflating them?
    success_criteria:
      - Each durable claim has a hypothesis spec and verifier.
      - Run records preserve enough data to regenerate reports.
      - New behavior-affecting fields are declared in specs and validated at load.
  runtime: {}
  dsl: {}
  application: {}
  roadmap:
    current_state: >
      The project has declarative specs, local runners, generated analysis,
      preserved run records, and a project-local static viewer.
    target_state: >
      Claims about pipeline behavior are expressed as verifiable project-local
      records and can be regenerated from specs and run data.
    work_tracks:
      - title: Experiment Evidence
        status: in_progress
        problem: Pipeline claims can become stale if reports drift away from preserved runs.
        target: Reports and verdicts derive from specs, run records, and verifier scripts.
        next_step: Keep docs, specs, run records, and generated reports aligned through local validation.
        done_when:
          - Each durable claim has a hypothesis spec and verifier.
          - Reports can be regenerated from specs and run records.
    next_steps:
      - Keep the manifest and local viewer aligned with experiment specs, reports, and roadmap state.
    open_decisions: []
  evaluation:
    checks:
      - python3 cli.py --list
      - pytest tests/test_specs_validate.py
    results:
      - Metrics and reports are organized around throughput, quality, latency, adaptation, and stability.
      - Verifiers separate measured findings from inferred explanations.
    evidence:
      - README.md
      - docs/DESIGN.md
      - docs/HYPOTHESES.md
      - specs
      - runs
      - analysis
    limits:
      - The project does not claim universal video or cellular behavior beyond the tested workloads, networks, codecs, and hosts.
repository:
  url: https://github.com/ZiyanWu93/GstreamerExp
local_site:
  entry: index.html
roadmap:
  current_state: Local roadmap details live in docs/TODO.md.
  target_state: Roadmap notes stay linked from capabilities and authored project pages.
  work_tracks:
    - title: Local Roadmap
      status: in_progress
      problem: Workspace roadmap details still live in project-local documentation.
      target: Project Management sees structured work status while detailed notes remain in project pages.
      next_step: Keep docs/TODO.md linked through capabilities and authored pages.
      done_when:
        - Project Management validates the simplified roadmap shape.
  next_steps:
    - Keep docs/TODO.md aligned with project-local implementation work.
  open_decisions: []
validation_profile:
  declaration_checks:
    - python3 cli.py --list
    - pytest tests/test_specs_validate.py
  readiness_checks:
    - python3 cli.py 1
  regression_checks:
    - pytest
capabilities:
  local_site:
    state: supported
    paths:
      - index.html
  local_specs:
    state: supported
    paths:
      - specs
  local_runtime:
    state: delegated
    commands:
      - python3 cli.py
      - python3 experiment.py
  local_analysis:
    state: supported
    paths:
      - analysis
  roadmap:
    state: supported
    paths:
      - docs/TODO.md
  entelesis_runtime_mount:
    state: not_applicable
management_plan:
  next_action: Keep the manifest and local viewer aligned with experiment specs, reports, and roadmap state.
